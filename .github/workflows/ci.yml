name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/shengxin-ppt-dev.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/shengxin-ppt-dev.log
          exit 1
        env:
          SESSION_PASSWORD: ci_only_session_password_at_least_32_chars

      - name: Resume flow E2E
        run: npm run test:e2e:resume
        env:
          BASE_URL: http://127.0.0.1:3000

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            tmp/*.png
            /tmp/shengxin-ppt-dev.log
